name: Bauen und veröffentlichen

on:
  push:
    branches: [main]
  # Pull Requests (z. B. von Dependabot) werden nur gebaut und geprüft, nicht veröffentlicht
  pull_request:
    branches: [main]
  schedule:
    # Stündlich neu bauen, damit Podcast-Folgen und Meetup-Termine aktuell bleiben
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repository-Variable PUBLIC_NOINDEX auf 1 setzen, solange die Seite nur ein Preview ist:
      # Seiten bekommen noindex, robots.txt sperrt Crawler, Impressum-Platzhalter blockieren den Deploy nicht
      # In Pull Requests immer Preview-Modus, damit die Platzhalter den Probebau nicht stoppen
      PUBLIC_NOINDEX: ${{ github.event_name == 'pull_request' && '1' || vars.PUBLIC_NOINDEX }}
      # Adresse des Live-Dienstes (einundzwanzig-live), z. B. https://live.einundzwanzig.dev. Leer = rein statisch.
      PUBLIC_LIVE_URL: ${{ vars.PUBLIC_LIVE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check-links
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
